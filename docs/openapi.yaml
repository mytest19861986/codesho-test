openapi: 3.0.3
info:
  title: Codesho API
  version: 0.1.0
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: api_v1_auth_csrf_retrieve
      description: Creates the CSRF token and device-cookie boundary for a tenant
        host.
      summary: Establish CSRF and device cookies for a tenant host
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: CSRF and device cookies established.
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      description: Flushes the tenant-scoped session and records the runtime audit
        event.
      summary: Flush the authenticated tenant session
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token required by the runtime endpoint.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Session flushed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: CSRF failure or authorization boundary.
  /api/v1/auth/passcode/change/complete/:
    post:
      operationId: api_v1_auth_passcode_change_complete_create
      description: Consumes a valid challenge and requires a fresh login after completion.
      summary: Complete a forced passcode change without creating a session
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token required by the runtime endpoint.
        required: true
      - in: cookie
        name: __Host-codesho-passcode-change
        schema:
          type: string
        description: HttpOnly forced passcode-change challenge cookie.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasscodeChangeCompletionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Challenge consumed; no session created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request or tenant signal.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Fixed authentication failure response.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: CSRF failure or authorization boundary.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict with the current state.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Abuse-control limit; the runtime supplies a non-negative Retry-After
            response header.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Critical dependency unavailable.
  /api/v1/auth/passcode/login/:
    post:
      operationId: api_v1_auth_passcode_login_create
      description: Creates a tenant session only after successful runtime authentication.
      summary: Authenticate a tenant member with a passcode
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token required by the runtime endpoint.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasscodeLoginRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Session established.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request or tenant signal.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Fixed authentication failure response.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Abuse-control limit; the runtime supplies a non-negative Retry-After
            response header.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Critical dependency unavailable.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Passcode change challenge cookie issued.
  /api/v1/auth/session/:
    get:
      operationId: api_v1_auth_session_retrieve
      description: Returns the current tenant-scoped session state.
      summary: Return the authenticated user and current tenant membership
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Fixed authentication failure response.
  /api/v1/auth/signup/adult-attestation/:
    post:
      operationId: api_v1_auth_signup_adult_attestation_create
      description: Internal-only synthetic attestation; no account, credential, membership,
        or session is created.
      summary: Record an internal synthetic adult age attestation
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token required by the runtime endpoint.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdultAgeAttestationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdultAgeAttestationReceipt'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdultAgeAttestationReceipt'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request or tenant signal.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Fixed authentication failure response.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: CSRF failure or authorization boundary.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict with the current state.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Abuse-control limit; the runtime supplies a non-negative Retry-After
            response header.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Critical dependency unavailable.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal-only feature disabled.
components:
  schemas:
    AdultAgeAttestationReceipt:
      type: object
      properties:
        attestationId:
          type: string
          format: uuid
        attestedAt:
          type: string
          format: date-time
        policyVersion:
          type: string
        source:
          $ref: '#/components/schemas/SourceEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - attestationId
      - attestedAt
      - policyVersion
      - source
      - status
    AdultAgeAttestationRequest:
      type: object
      properties:
        adultAttestation:
          type: boolean
        policyVersion:
          type: string
          maxLength: 64
        subjectId:
          type: string
          format: uuid
      required:
      - adultAttestation
      - policyVersion
      - subjectId
    Error:
      type: object
      properties:
        code:
          type: string
      required:
      - code
    PasscodeChangeCompletionRequest:
      type: object
      properties:
        newPasscode:
          type: string
          pattern: ^[0-9]{6}$
      required:
      - newPasscode
    PasscodeLoginRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        passcode:
          type: string
          pattern: ^[0-9]{6}$
      required:
      - passcode
      - username
    SessionState:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
        tenant:
          $ref: '#/components/schemas/Tenant'
      required:
      - authenticated
      - tenant
      - user
    SourceEnum:
      enum:
      - internal_test_api
      type: string
      description: '* `internal_test_api` - internal_test_api'
    StatusEnum:
      enum:
      - adult_attested
      type: string
      description: '* `adult_attested` - adult_attested'
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        role:
          type: string
      required:
      - id
      - role
      - slug
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
      required:
      - id
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid

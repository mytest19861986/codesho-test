openapi: 3.0.3
info:
  title: Codesho API
  version: 0.1.0
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: api_v1_auth_csrf_retrieve
      description: Creates the CSRF token and device-cookie boundary for a tenant
        host.
      summary: Establish CSRF and device cookies for a tenant host
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: CSRF and device cookies established.
  /api/v1/learning/mentor/cohorts/{cohort_id}/analytics/:
    get:
      operationId: api_v1_learning_mentor_cohort_analytics_retrieve
      summary: Retrieve aggregated cohort analytics projection for supervised cohort
      parameters:
      - in: path
        name: cohort_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - learning-supervision
      responses:
        '200':
          description: Cohort progress and assessment analytics aggregate.
        '404':
          description: Cohort not found or unassigned to requesting mentor.
  /api/v1/learning/mentor/cohorts/{cohort_id}/alerts/:
    get:
      operationId: api_v1_learning_mentor_cohort_alerts_list
      summary: List educational supervision alerts for a supervised cohort
      parameters:
      - in: path
        name: cohort_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - learning-supervision
      responses:
        '200':
          description: Active and historical supervision alerts.
        '404':
          description: Cohort not found or unassigned.
  /api/v1/learning/mentor/cohorts/{cohort_id}/alerts/{alert_id}/transition/:
    post:
      operationId: api_v1_learning_mentor_cohort_alert_transition_create
      summary: Transition alert state along FSM lifecycle
      parameters:
      - in: path
        name: cohort_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: alert_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - learning-supervision
      responses:
        '200':
          description: Alert state transitioned successfully.
        '400':
          description: Invalid FSM transition.
        '404':
          description: Cohort or alert not found.
  /api/v1/learning/discussions/threads/:
    get:
      operationId: api_v1_learning_discussions_threads_list
      summary: List discussion threads within cohort or lesson
      parameters:
      - in: query
        name: cohort_id
        schema:
          type: string
          format: uuid
        required: false
      - in: query
        name: lesson_id
        schema:
          type: string
          format: uuid
        required: false
      tags:
      - learning-discussions
      responses:
        '200':
          description: Filtered discussion threads.
        '400':
          description: Invalid query parameters.
    post:
      operationId: api_v1_learning_discussions_threads_create
      summary: Create new discussion thread
      tags:
      - learning-discussions
      responses:
        '201':
          description: Discussion thread created (default PENDING).
        '400':
          description: Invalid payload or scope violation.
        '403':
          description: Not enrolled in cohort or course.
  /api/v1/learning/discussions/threads/{thread_id}/:
    get:
      operationId: api_v1_learning_discussions_threads_retrieve
      summary: Retrieve thread details and comments
      parameters:
      - in: path
        name: thread_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - learning-discussions
      responses:
        '200':
          description: Thread details and visible comments.
        '404':
          description: Thread not found or inaccessible.
  /api/v1/learning/discussions/threads/{thread_id}/comments/:
    post:
      operationId: api_v1_learning_discussions_threads_comments_create
      summary: Add comment or reply to thread
      parameters:
      - in: path
        name: thread_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - learning-discussions
      responses:
        '201':
          description: Comment created (default PENDING).
        '400':
          description: Invalid comment data or self-parenting attempt.
        '403':
          description: Thread locked or not enrolled.
  /api/v1/learning/discussions/threads/{thread_id}/pin/:
    post:
      operationId: api_v1_learning_discussions_threads_pin_create
      summary: Pin or unpin thread (Mentor/Staff only)
      parameters:
      - in: path
        name: thread_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - learning-discussions
      responses:
        '200':
          description: Thread pinned state updated.
        '403':
          description: Only mentors and staff can pin threads.
  /api/v1/learning/discussions/comments/{comment_id}/endorse/:
    post:
      operationId: api_v1_learning_discussions_comments_endorse_create
      summary: Endorse comment as high quality answer (Mentor/Staff only)
      parameters:
      - in: path
        name: comment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - learning-discussions
      responses:
        '200':
          description: Comment endorsed successfully.
        '400':
          description: Comment not in approved status.
        '403':
          description: Only mentors and staff can endorse comments.
  /api/v1/learning/discussions/moderation/action/:
    post:
      operationId: api_v1_learning_discussions_moderation_action_create
      summary: Execute moderation action and append to immutable audit log
      tags:
      - learning-discussions
      responses:
        '200':
          description: Moderation action recorded and status updated.
        '400':
          description: Invalid action parameters.
        '403':
          description: Only mentors and staff can moderate.
  /api/v1/learning/personalization/profile/:
    get:
      operationId: api_v1_learning_personalization_profile_retrieve
      summary: Retrieve student learning profile and growth indicators
      tags:
      - learning-personalization
      responses:
        '200':
          description: Student learning profile projection.
        '401':
          description: Authentication required.
    post:
      operationId: api_v1_learning_personalization_profile_rebuild
      summary: Rebuild student learning profile deterministically
      tags:
      - learning-personalization
      responses:
        '200':
          description: Rebuilt student learning profile.
        '401':
          description: Authentication required.
  /api/v1/learning/personalization/recommendations/:
    get:
      operationId: api_v1_learning_personalization_recommendations_list
      summary: List active adaptive recommendations for student
      tags:
      - learning-personalization
      responses:
        '200':
          description: Active adaptive recommendations.
        '401':
          description: Authentication required.
  /api/v1/learning/personalization/recommendations/{recommendation_id}/action/:
    post:
      operationId: api_v1_learning_personalization_recommendation_action_create
      summary: Transition recommendation state along FSM lifecycle
      parameters:
      - in: path
        name: recommendation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - learning-personalization
      responses:
        '200':
          description: Recommendation status transitioned.
        '400':
          description: Invalid transition attempt.
        '403':
          description: Unauthorized to modify recommendation.
        '404':
          description: Recommendation not found.
  /api/v1/learning/personalization/skills/:
    get:
      operationId: api_v1_learning_personalization_skills_list
      summary: Retrieve curriculum skill definitions and DAG dependency edges
      tags:
      - learning-personalization
      responses:
        '200':
          description: Skill definitions and dependency graph.
  /api/v1/learning/portfolio/:
    get:
      operationId: api_v1_learning_portfolio_retrieve
      summary: Retrieve authenticated student learning portfolio
      tags:
      - learning-portfolio
      responses:
        '200':
          description: Student portfolio details.
        '401':
          description: Authentication required.
        '404':
          description: Portfolio not found.
    post:
      operationId: api_v1_learning_portfolio_create
      summary: Create or initialize student learning portfolio
      tags:
      - learning-portfolio
      responses:
        '201':
          description: Portfolio created.
        '400':
          description: Validation error.
        '401':
          description: Authentication required.
  /api/v1/learning/portfolio/guardian/{student_id}/:
    get:
      operationId: api_v1_learning_portfolio_guardian_retrieve
      summary: Retrieve student portfolio under verified active guardian access grant
      parameters:
      - in: path
        name: student_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - learning-portfolio
      responses:
        '200':
          description: Student portfolio for authorized guardian.
        '401':
          description: Authentication required.
        '403':
          description: Active guardian access grant required.
        '404':
          description: Portfolio private or not found.
  /api/v1/learning/portfolio/{portfolio_id}/artifacts/:
    post:
      operationId: api_v1_learning_portfolio_artifacts_create
      summary: Attach verified educational achievement artifact to portfolio
      parameters:
      - in: path
        name: portfolio_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - learning-portfolio
      responses:
        '201':
          description: Artifact attached successfully.
        '400':
          description: Validation error or cross-tenant source link.
  /api/v1/learning/portfolio/journey/{student_id}/:
    get:
      operationId: api_v1_learning_portfolio_journey_retrieve
      summary: Retrieve chronological journey narrative timeline for student
      parameters:
      - in: path
        name: student_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - learning-portfolio
      responses:
        '200':
          description: Chronological journey milestones.
  /api/v1/learning/insights/{student_id}/:
    get:
      operationId: api_v1_learning_growth_insights_retrieve
      summary: Retrieve active formative growth insights for a student (zero peer comparison)
      parameters:
      - in: path
        name: student_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - learning-growth-insights
      responses:
        '200':
          description: Active student formative insights feed.
        '400':
          description: Peer comparison or ranking query parameters rejected.
        '401':
          description: Authentication required.
        '403':
          description: Access denied.
  /api/v1/learning/insights/trends/{student_id}/:
    get:
      operationId: api_v1_learning_growth_trends_retrieve
      summary: Retrieve longitudinal competency vectors and metric progress snapshots
      parameters:
      - in: path
        name: student_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - learning-growth-insights
      responses:
        '200':
          description: Longitudinal competency trends and snapshots.
        '400':
          description: Invalid request or peer ranking parameters.
        '401':
          description: Authentication required.
        '403':
          description: Access denied.
  /api/v1/learning/insights/milestones/{student_id}/:
    get:
      operationId: api_v1_learning_growth_milestones_retrieve
      summary: Retrieve formative milestones timeline
      parameters:
      - in: path
        name: student_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: include_retracted
        schema:
          type: boolean
        required: false
      tags:
      - learning-growth-insights
      responses:
        '200':
          description: Formative milestones list.
        '401':
          description: Authentication required.
        '403':
          description: Access denied.
  /api/v1/learning/insights/recalculate/:
    post:
      operationId: api_v1_learning_insights_recalculate_create
      summary: Trigger idempotent longitudinal calculation under advisory lock
      tags:
      - learning-growth-insights
      responses:
        '200':
          description: Recalculation run status and details.
        '400':
          description: Validation error or invalid parameters.
        '401':
          description: Authentication required.
        '403':
          description: Staff or assigned mentor authorization required.
  /api/v1/learning/insights/milestones/{milestone_id}/retract/:
    patch:
      operationId: api_v1_learning_milestones_retract_update
      summary: Retract or restore a formative milestone
      parameters:
      - in: path
        name: milestone_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - learning-growth-insights
      responses:
        '200':
          description: Milestone state updated.
        '400':
          description: Validation error.
        '403':
          description: Unauthorized.
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      description: Flushes the tenant-scoped session and records the runtime audit
        event.
      summary: Flush the authenticated tenant session
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token required by the runtime endpoint.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Session flushed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: CSRF failure or authorization boundary.
  /api/v1/auth/passcode/change/complete/:
    post:
      operationId: api_v1_auth_passcode_change_complete_create
      description: Consumes a valid challenge and requires a fresh login after completion.
      summary: Complete a forced passcode change without creating a session
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token required by the runtime endpoint.
        required: true
      - in: cookie
        name: __Host-codesho-passcode-change
        schema:
          type: string
        description: HttpOnly forced passcode-change challenge cookie.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasscodeChangeCompletionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Challenge consumed; no session created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request or tenant signal.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Fixed authentication failure response.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: CSRF failure or authorization boundary.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict with the current state.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Abuse-control limit; the runtime supplies a non-negative Retry-After
            response header.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Critical dependency unavailable.
  /api/v1/auth/passcode/login/:
    post:
      operationId: api_v1_auth_passcode_login_create
      description: Creates a tenant session only after successful runtime authentication.
      summary: Authenticate a tenant member with a passcode
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token required by the runtime endpoint.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasscodeLoginRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Session established.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request or tenant signal.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Fixed authentication failure response.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Abuse-control limit; the runtime supplies a non-negative Retry-After
            response header.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Critical dependency unavailable.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Passcode change challenge cookie issued.
  /api/v1/auth/session/:
    get:
      operationId: api_v1_auth_session_retrieve
      description: Returns the current tenant-scoped session state.
      summary: Return the authenticated user and current tenant membership
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Fixed authentication failure response.
  /api/v1/auth/signup/adult-attestation/:
    post:
      operationId: api_v1_auth_signup_adult_attestation_create
      description: Internal-only synthetic attestation; no account, credential, membership,
        or session is created.
      summary: Record an internal synthetic adult age attestation
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token required by the runtime endpoint.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdultAgeAttestationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdultAgeAttestationReceipt'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdultAgeAttestationReceipt'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request or tenant signal.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Fixed authentication failure response.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: CSRF failure or authorization boundary.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict with the current state.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Abuse-control limit; the runtime supplies a non-negative Retry-After
            response header.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Critical dependency unavailable.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal-only feature disabled.
  /api/v1/learning/courses/:
    get:
      operationId: api_v1_learning_courses_list
      description: Returns only published courses visible to the authenticated active
        tenant membership. Pagination is evaluated independently per request.
      summary: List published courses for the current tenant
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Positive page number; defaults to 1.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Positive page size, maximum 100; defaults to 20.
      tags:
      - learning
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResults'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid pagination.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Fixed authentication failure response.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: CSRF failure or authorization boundary.
  /api/v1/learning/courses/{course_id}/lessons/:
    get:
      operationId: api_v1_learning_course_lessons_list
      description: Returns only published lessons for a published course visible to
        the authenticated active tenant membership. Hidden, missing, and cross-tenant
        parents have identical not-found semantics.
      summary: List published lessons for a visible course
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
          format: uuid
        description: Course UUID.
        required: true
      - in: query
        name: page
        schema:
          type: integer
        description: Positive page number; defaults to 1.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Positive page size, maximum 100; defaults to 20.
      tags:
      - learning
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResults'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid pagination.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Fixed authentication failure response.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: CSRF failure or authorization boundary.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Course not found.
  /api/v1/learning/student/certificates/:
    get:
      operationId: api_v1_learning_student_certificates_list
      description: Returns certificates issued to the current student.
      summary: List student course certificates
      tags:
      - learning
      security:
      - cookieAuth: []
      responses:
        '200':
          description: List of certificates.
        '403':
          description: Forbidden.
  /api/v1/learning/certificates/verify/:
    get:
      operationId: api_v1_learning_certificates_verify_retrieve
      description: Public zero-PII certificate verification by certificate number.
      summary: Verify certificate authenticity
      parameters:
      - in: query
        name: number
        schema:
          type: string
        description: Serial certificate number.
        required: true
      tags:
      - learning
      responses:
        '200':
          description: Certificate is valid.
        '404':
          description: Certificate is revoked or not found.
  /api/v1/learning/student/achievements/:
    get:
      operationId: api_v1_learning_student_achievements_list
      description: Returns chronological milestone achievement timeline for student.
      summary: List student achievements timeline
      tags:
      - learning
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Achievement timeline list.
        '403':
          description: Forbidden.
components:
  schemas:
    AdultAgeAttestationReceipt:
      type: object
      properties:
        attestationId:
          type: string
          format: uuid
        attestedAt:
          type: string
          format: date-time
        policyVersion:
          type: string
        source:
          $ref: '#/components/schemas/SourceEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - attestationId
      - attestedAt
      - policyVersion
      - source
      - status
    AdultAgeAttestationRequest:
      type: object
      properties:
        adultAttestation:
          type: boolean
        policyVersion:
          type: string
          maxLength: 64
        subjectId:
          type: string
          format: uuid
      required:
      - adultAttestation
      - policyVersion
      - subjectId
    CourseItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
        state:
          $ref: '#/components/schemas/StateEnum'
      required:
      - code
      - id
      - state
      - title
    CourseResults:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/CourseItem'
      required:
      - results
    Error:
      type: object
      properties:
        code:
          type: string
      required:
      - code
    LessonItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
        position:
          type: integer
          minimum: 1
        state:
          $ref: '#/components/schemas/StateEnum'
      required:
      - code
      - id
      - position
      - state
      - title
    LessonResults:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/LessonItem'
      required:
      - results
    PasscodeChangeCompletionRequest:
      type: object
      properties:
        newPasscode:
          type: string
          pattern: ^[0-9]{6}$
      required:
      - newPasscode
    PasscodeLoginRequest:
      type: object
      properties:
